<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Skate Dat Way</title>
    <meta
      name="description"
      content="A rollerblading camera roll that got out of hand. Clips from Barcelona, Marrakech, Berlin and around the UK, plus the spots worth going back to."
    />
    <meta name="author" content="Skate Dat Way" />
    <meta
      name="keywords"
      content="rollerblading, aggressive inline, wizard skating, street skating, slalom, barcelona, marrakech, london, skate spots"
    />
    <link rel="canonical" href="https://skatedatway.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skate Dat Way" />
    <meta property="og:url" content="https://skatedatway.com/" />
    <meta property="og:title" content="Skate Dat Way · rollerblading archive" />
    <meta
      property="og:description"
      content="A rollerblading camera roll that got out of hand. Clips from Barcelona, Marrakech, Berlin and around the UK. No shop, no team, no sponsors."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Skate Dat Way. A skater rolling across open tarmac on inline skates."
    />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Skate Dat Way · rollerblading archive"
    />
    <meta
      name="twitter:description"
      content="A rollerblading camera roll that got out of hand. Barcelona, Marrakech, Berlin, and around the UK."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Skate Dat Way. A skater rolling across open tarmac on inline skates."
    />

    <!-- The first hero poster is the LCP element. It is frame 0 of the first
         clip, so fetching it early paints the hero before the video has
         streamed. Later clips in the rotation are fetched on demand. -->
    <link
      rel="preload"
      as="image"
      href="/posters/hero-1.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
